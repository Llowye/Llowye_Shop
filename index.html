/* OVERLAY BACKGROUND PEREDUP MODAL */
.modalOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  z-index: 999999;
  padding-top: 22vh;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  overflow: hidden !important;
}

.modalOverlay.show {
  opacity: 1;
  pointer-events: auto;
}

.modalBox {
  position: relative;
  background: #ffffff;
  border: 5px solid #C8F7F2;
  border-radius: 25px 0px 25px 25px;
  padding: 20px 15px;
  width: 320px;
  max-width: 90%;

  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  transform: translateX(100vw);

}

.modalOverlay.show .modalBox {
  transform: translateX(0);
}

.modalOverlay.hideRight .modalBox {
  transform: translateX(100vw) !important;
  transition: transform 0.5s ease-in;
}
