  <style>
    :root{
      --pink:#FF6FA5; --purple:#6C5CE7; --yellow:#FFC145; --green:#2ECC71; --blue:#4A90E2; --red:#FF5C5C; --ink:#26243B; --muted:#726F8C; --bg:#FAF8FF; --card:#FFFFFF; --line:#ECE9F7;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    body{font-family:'Quicksand', sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;}
    h1,h2,h3,.logo{font-family:'Fredoka', sans-serif;}
    a{text-decoration:none; color:inherit;}
    img{max-width:100%; display:block;}

    /* MODAL WARNING STYLE */
    .modalOverlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: flex-start; z-index: 999999; padding-top: 22vh; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
    }
    .modalOverlay.show { opacity: 1; pointer-events: auto; }
    .modalBox { position: relative; background: #ffffff; border: 5px solid #C8F7F2; border-radius: 25px 0px 25px 25px; padding: 20px 15px; width: 320px; max-width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: translateX(100vw); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .modalOverlay.show .modalBox { transform: translateX(0); }
    .modalOverlay.hideRight .modalBox { transform: translateX(100vw) !important; transition: transform 0.5s ease-in; }
    .catSleeping { position: absolute; top: -85px; right: -25px; width: 95px; height: auto; pointer-events: none; z-index: 10; }
    .modalBox h3 { font-family: 'Baloo 2', 'Fredoka', sans-serif; font-style: normal !important; color: #ff0000; font-size: 20px; font-weight: 800; margin-bottom: 12px; }
    .modalBox p { font-family: 'Quicksand', sans-serif; font-size: 13px; line-height: 1.5; color: #26243B; }
    .modalButtons { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; }
    .btnAccept { font-family: 'Baloo 2', 'Fredoka', sans-serif; font-style: normal !important; border: none; padding: 9px 14px; border-radius: 18px; font-size: 12px; cursor: pointer; background: #bbf7d0; color: #166534; font-weight: 700; box-shadow: 0 4px 0 #86efac; }
    .btnRefuse { font-family: 'Baloo 2', 'Fredoka', sans-serif; font-style: normal !important; border: none; padding: 9px 16px; border-radius: 18px; font-size: 12px; cursor: pointer; background: #ff4d4d; color: #5c0000; font-weight: 800; box-shadow: 0 4px 0 #cc0000; }
    
    /* STYLE LAINNYA */
    .hero{padding:28px 20px 20px; text-align:center; position:relative; overflow:hidden;}
    .wordmark{font-family:'Fredoka', sans-serif; font-size:44px; font-weight:700; letter-spacing:-1px;}
    .wordmark span:nth-child(1){color:var(--blue);} .wordmark span:nth-child(2){color:var(--red);} .wordmark span:nth-child(3){color:var(--yellow);} .wordmark span:nth-child(4){color:var(--blue);} .wordmark span:nth-child(5){color:var(--green);} .wordmark span:nth-child(6){color:var(--red);}
    .searchbar{margin:20px auto 0; max-width:480px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:14px 18px; display:flex; align-items:center; gap:10px; box-shadow:0 6px 20px rgba(108,92,231,0.08);}
    .searchbar input{border:none; outline:none; flex:1; font-size:14px; background:transparent;}
    .btn-3d { border: none; border-radius: 999px; box-shadow: 0 6px 0 var(--shadow-color, rgba(0,0,0,0.18)), 0 8px 14px rgba(0,0,0,0.12); cursor: pointer; }
    .cara-panel, .snk-panel, .faq-panel{position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); transform:translateX(-100%); transition:transform .35s ease; z-index:1000; overflow-y:auto; padding:20px;}
    .cara-panel.open, .snk-panel.open, .faq-panel.open{transform:translateX(0);}
    .snk-back{background:var(--card); border:1px solid var(--line); color:var(--purple); font-weight:700; padding:10px 14px; border-radius:999px; margin-bottom:16px; cursor:pointer;}
  </style>
</head>

<!-- MODAL S&K -->

  </div>
</section>

<script>
  // Fungsi Penting:
  function showSnkModal() { document.getElementById("snkModal").classList.add("show"); }
  function closeSnk() { document.getElementById("snkModal").classList.add("hideRight"); setTimeout(() => document.getElementById("snkModal").classList.remove("show", "hideRight"), 500); }
  function acceptSnk() { closeSnk(); }
  setTimeout(showSnkModal, 3000);

  function toggleSnk() { document.getElementById('snkPanel').classList.toggle('open'); }
  function toggleCaraOrder() { document.getElementById('caraPanel').classList.toggle('open'); }
  // (Sisa script fungsi lainnya tetap sama)
</script>
